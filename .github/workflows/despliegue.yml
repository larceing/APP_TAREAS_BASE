# Pruebas, imagen y despliegue por entornos. Ver docs/DESPLIEGUE.md.
#
#   push a main            -> pruebas -> imagen sha-xxxxxxx -> DEV
#   release publicada vX   -> pruebas -> imagen vX           -> PRE -> (aprobar) -> PRO
#   "Run workflow" a mano  -> pone una version que ya existe en el entorno
#                             elegido (o "anterior" = rollback)
#   pull request           -> solo pruebas
name: Despliegue

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno
        type: choice
        options: [dev, pre, pro]
        required: true
      version:
        description: 'Versión ya construida (v1.2.0, sha-1a2b3c4) o "anterior" para volver a la versión buena previa'
        required: true
        default: anterior

permissions:
  contents: read

jobs:
  pruebas:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      bd:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: app_tareas
      DB_PASSWORD: pruebas
      DB_NAME: app_tareas
      DB_NAME_TEST: app_tareas_test
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: root
      INSTALAR_ADMIN_PASSWORD: pruebas
      SESSION_SECRET_KEY: pruebas
      APP_TAREAS_SIN_ESCRITORIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app_fastapi/requirements.txt
      - run: pip install -r app_fastapi/requirements.txt
      - run: python scripts/instalar.py --esperar 90
      - run: python -m unittest app_fastapi.tests
      - name: tareas.sh sin errores de sintaxis
        run: bash -n despliegue/servidor/tareas.sh

  imagen:
    needs: pruebas
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=main" >> "$GITHUB_OUTPUT"
          fi
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dev:
    needs: imagen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.URL_DEV }}
    concurrency: despliegue-dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desplegar
        with:
          entorno: dev
          version: ${{ needs.imagen.outputs.version }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          usuario: ${{ vars.DEPLOY_USER || 'root' }}
          puerto: ${{ vars.DEPLOY_PORT || '22' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  pre:
    needs: imagen
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pre
      url: ${{ vars.URL_PRE }}
    concurrency: despliegue-pre
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desplegar
        with:
          entorno: pre
          version: ${{ needs.imagen.outputs.version }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          usuario: ${{ vars.DEPLOY_USER || 'root' }}
          puerto: ${{ vars.DEPLOY_PORT || '22' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # El entorno "pro" de GitHub tiene "Required reviewers": este paso espera a
  # que alguien pulse "Approve" tras probar la version en PRE.
  pro:
    needs: [imagen, pre]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pro
      url: ${{ vars.URL_PRO }}
    concurrency: despliegue-pro
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desplegar
        with:
          entorno: pro
          version: ${{ needs.imagen.outputs.version }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          usuario: ${{ vars.DEPLOY_USER || 'root' }}
          puerto: ${{ vars.DEPLOY_PORT || '22' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  a-mano:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.entorno }}
    concurrency: despliegue-${{ inputs.entorno }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desplegar
        with:
          entorno: ${{ inputs.entorno }}
          version: ${{ inputs.version }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          usuario: ${{ vars.DEPLOY_USER || 'root' }}
          puerto: ${{ vars.DEPLOY_PORT || '22' }}
          token: ${{ secrets.GITHUB_TOKEN }}
