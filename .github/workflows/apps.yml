# Otras apps del servidor (no Tareas): crearlas en DEV y PRO, ponerles una
# versión, volver atrás y llevar una app de PRO a su propio dominio. Lo lanza
# el panel Ajustes del servidor (portada -> Ajustes) o "Run workflow" aquí.
# El servidor hace el trabajo (tareas.sh, con la misma clave SSH limitada que
# despliegue.yml) y su respuesta queda en el resumen de la ejecución.
name: Apps

on:
  workflow_dispatch:
    inputs:
      accion:
        description: Qué hacer
        type: choice
        options: [nueva, desplegar, dominio, estado]
        required: true
      app:
        description: 'Ruta de la app (inventario = /inventario/); "tareas" para el dominio de Tareas'
        required: false
      nombre:
        description: 'nueva: nombre que se ve en la portada'
        required: false
      imagen:
        description: 'nueva: imagen sin versión (ghcr.io/usuario/inventario)'
        required: false
      puerto:
        description: 'nueva: puerto en el que escucha la app'
        required: false
        default: "8000"
      salud:
        description: 'nueva: camino que responde 200 si la app va bien (vacío = /)'
        required: false
      entorno:
        description: 'desplegar: dev o pro'
        type: choice
        options: [dev, pro]
        required: false
      version:
        description: 'desplegar: etiqueta de la imagen (v1.0.0, sha-1a2b3c4) o "anterior"'
        required: false
      dominio:
        description: 'dominio: el dominio propio (inventario.midominio.com)'
        required: false

run-name: "${{ inputs.accion }} ${{ inputs.app }} ${{ inputs.accion == 'desplegar' && format('{0} {1}', inputs.entorno, inputs.version) || inputs.dominio }}"

permissions:
  contents: read
  packages: read

concurrency: apps-${{ inputs.app || 'todas' }}

jobs:
  servidor:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir al servidor
        env:
          ACCION: ${{ inputs.accion }}
          APP: ${{ inputs.app }}
          NOMBRE: ${{ inputs.nombre }}
          IMAGEN: ${{ inputs.imagen }}
          PUERTO: ${{ inputs.puerto }}
          SALUD: ${{ inputs.salud }}
          ENTORNO: ${{ inputs.entorno }}
          VERSION: ${{ inputs.version }}
          DOMINIO: ${{ inputs.dominio }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          USUARIO: ${{ vars.DEPLOY_USER || 'root' }}
          PUERTO_SSH: ${{ vars.DEPLOY_PORT || '22' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -o pipefail
          resumen() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          falla() { echo "::error::$1"; resumen "### ❌ $1"; exit 1; }
          [ -n "$SSH_KEY" ] && [ -n "$HOST" ] && [ -n "$KNOWN_HOSTS" ] || falla "Faltan los secretos del servidor (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS)"
          # lo mismo que comprueba el servidor, para fallar pronto y con un mensaje claro
          ruta='^[a-z][a-z0-9-]{1,30}$'
          case "$ACCION" in
            nueva)
              [[ "$APP" =~ $ruta ]] || falla "Ruta no válida: '$APP' (minúsculas, números y guiones)"
              [[ "${IMAGEN,,}" =~ ^[a-z0-9][a-z0-9./_-]+$ ]] || falla "Imagen no válida: '$IMAGEN'"
              [[ "$PUERTO" =~ ^[0-9]{2,5}$ ]] || falla "Puerto no válido: '$PUERTO'"
              [[ "$SALUD" =~ ^[A-Za-z0-9._/-]*$ ]] || falla "Camino de salud no válido: '$SALUD'"
              [[ "$NOMBRE" =~ ^[[:alnum:][:space:]._()áéíóúÁÉÍÓÚñÑüÜ-]{0,60}$ ]] || falla "Nombre no válido: '$NOMBRE'"
              orden="app-nueva $APP ${IMAGEN,,} $PUERTO ${SALUD:--} $NOMBRE" ;;
            desplegar)
              [[ "$APP" =~ $ruta ]] || falla "Ruta no válida: '$APP'"
              [[ "$ENTORNO" =~ ^(dev|pro)$ ]] || falla "Entorno no válido: '$ENTORNO'"
              [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || falla "Versión no válida: '$VERSION'"
              orden="app-desplegar $APP $ENTORNO $VERSION" ;;
            dominio)
              [[ "$APP" == tareas || "$APP" =~ $ruta ]] || falla "App no válida: '$APP'"
              [[ "${DOMINIO,,}" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$ ]] || falla "Dominio no válido: '$DOMINIO'"
              orden="dominio $APP ${DOMINIO,,}" ;;
            estado) orden="apps" ;;
            *) falla "Acción desconocida: '$ACCION'" ;;
          esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/despliegue && chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          set +e
          printf '%s %s\n' "$ACTOR" "$TOKEN" | ssh -i ~/.ssh/despliegue -p "$PUERTO_SSH" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$USUARIO@$HOST" "$orden" 2>&1 | tee salida.txt
          estado=$?
          set -e
          rm -f ~/.ssh/despliegue
          if [ "$estado" = 0 ]; then resumen "### ✅ Hecho"; else resumen "### ❌ Falló"; fi
          resumen '```' "$(tail -n 60 salida.txt)" '```'
          exit "$estado"
